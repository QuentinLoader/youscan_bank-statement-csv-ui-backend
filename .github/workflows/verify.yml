name: Verify backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: youscan_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youscan_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/youscan_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
